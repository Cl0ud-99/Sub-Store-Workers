name: Deploy Frontend UI
on:
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend dist
        run: |
          curl -L -o dist.zip https://github.com/sub-store-org/Sub-Store-Front-End/releases/download/2.34.3/dist.zip
          unzip -o dist.zip -d .
          ls dist | head
      - name: Write wrangler config
        run: |
          printf 'name = "sub-store-ui"\nmain = "index.js"\ncompatibility_date = "2025-11-17"\n[assets]\ndirectory = "./dist"\nbinding = "ASSETS"\nnot_found_handling = "single-page-application"\n' > wrangler.toml
          printf 'export default { async fetch(request, env) { return env.ASSETS.fetch(request); } };\n' > index.js
      - name: Deploy UI worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy --config wrangler.toml
